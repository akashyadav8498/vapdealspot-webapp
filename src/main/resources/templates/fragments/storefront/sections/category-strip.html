<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
    <section class="category-section" th:fragment="categoryStrip(sec)">
        <div class="container">
            <div class="section-header" th:if="${sec.props['title'] != null}">
                <div class="section-eyebrow" th:if="${sec.props['eyebrow']}" th:text="${sec.props['eyebrow']}">Browse</div>
                <h2 class="section-title" th:text="${sec.props['title']}">Shop by category</h2>
            </div>
            <div class="category-pills" th:if="${sec.props['categories'] != null}">
                <a th:each="cat : ${sec.props['categories']}"
                   th:href="@{${cat['path'] ?: '/category/' + cat['label']}}"
                   class="category-pill">
                    <span aria-hidden="true" th:text="${cat['icon'] ?: '📦'}">📦</span>
                    <span th:text="${cat['label']}">Vape Juices</span>
                    <span class="count" th:if="${cat['count'] != null}" th:text="${cat['count']}">549</span>
                </a>
            </div>
        </div>
    </section>
</body>
</html>
