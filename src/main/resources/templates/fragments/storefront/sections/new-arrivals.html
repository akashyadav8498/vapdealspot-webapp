<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
    <section class="product-section" th:fragment="newArrivals(sec, products)">
        <div class="container">
            <div class="section-header">
                <div class="section-eyebrow" th:if="${sec.props['eyebrow']}" th:text="${sec.props['eyebrow']}">First time on Vape Deal Spot</div>
                <h2 class="section-title" th:text="${sec.props['title'] ?: 'New arrivals'}">New arrivals</h2>
            </div>
            <div class="product-grid" th:if="${products != null and not #lists.isEmpty(products)}">
                <th:block th:each="prod : ${products}">
                    <div th:replace="~{fragments/storefront/product-card :: card(prod=${prod})}"></div>
                </th:block>
            </div>
        </div>
    </section>
</body>
</html>
