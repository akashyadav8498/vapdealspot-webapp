<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle != null ? pageTitle : 'Vape Deal Spot | Best Vape Deals & Coupons'}">Vape Deal Spot | Best Vape Deals & Coupons</title>
    
    <meta name="description" th:content="${metaDescription != null ? metaDescription : 'Find verified coupon codes, discounts, and compare vape prices across 25+ trusted retailers.'}">
    <link rel="canonical" th:if="${canonicalUrl}" th:href="${canonicalUrl}">

    <!-- Open Graph SEO Metadata -->
    <meta property="og:title" th:content="${pageTitle != null ? pageTitle : 'Vape Deal Spot'}">
    <meta property="og:description" th:content="${metaDescription != null ? metaDescription : 'Compare vape prices across 25+ retailers.'}">
    <meta property="og:type" content="website">
    <meta property="og:image" content="/OfficialLogo.jpeg">

    <!-- Customer V2 Core Stylesheet -->
    <link rel="stylesheet" th:href="@{/css/customer-v2.css}">
    
    <!-- Theme Script (executed immediately to prevent FOUC) -->
    <script>
        (function() {
            try {
                var saved = localStorage.getItem('theme');
                if (saved === 'dark' || (!saved && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                    document.documentElement.setAttribute('data-theme', 'dark');
                }
            } catch(e) {}
        })();
    </script>
    <script th:src="@{/js/customer-v2.js}" defer></script>
</head>
<body>
    <!-- Customer V2 Header Fragment -->
    <div th:replace="~{fragments/storefront/header :: header}"></div>

    <!-- Main Content Slot -->
    <main class="main-content" style="flex: 1;">
        <div th:replace="${contentFragment}">
            <!-- Default Content Placeholder -->
            <div class="container" style="padding-top: var(--space-8); padding-bottom: var(--space-8);">
                <h1>Storefront Page</h1>
            </div>
        </div>
    </main>

    <!-- Customer V2 Footer Fragment -->
    <div th:replace="~{fragments/storefront/footer :: footer}"></div>
</body>
</html>
