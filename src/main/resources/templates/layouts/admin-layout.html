<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle != null ? pageTitle + ' | Admin - Vape Deal Spot' : 'Admin Dashboard | Vape Deal Spot'}">Admin - Vape Deal Spot</title>
    
    <meta name="_csrf" th:if="${_csrf}" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:if="${_csrf}" th:content="${_csrf.headerName}"/>

    <link rel="stylesheet" th:href="@{/css/admin.css}">
    <script th:src="@{/js/common.js}"></script>
    <script th:src="@{/js/admin.js}" defer></script>
</head>
<body class="admin-root">
    <!-- Admin Sidebar Fragment -->
    <div th:replace="~{fragments/admin/sidebar :: sidebar}"></div>

    <div class="admin-main">
        <!-- Admin Topbar Header Fragment -->
        <div th:replace="~{fragments/admin/header :: header}"></div>

        <!-- Flash Toast Notification Fragment -->
        <div th:replace="~{fragments/admin/toast :: toast}"></div>

        <!-- Admin Content Area -->
        <main class="admin-content">
            <div th:replace="${adminContentFragment}">
                <div class="admin-card">
                    <h2>Admin Overview</h2>
                    <p>Administration panel placeholder.</p>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
