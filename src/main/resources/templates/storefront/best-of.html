<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle != null ? pageTitle : 'The Best Vapes of 2026 | Vape Deal Spot'}">The Best Vapes of 2026 | Vape Deal Spot</title>
    
    <meta name="description" th:content="${metaDescription != null ? metaDescription : 'Curated vape picks across devices, e-liquids, and more.'}">
    
    <link rel="stylesheet" th:href="@{/css/customer-v2.css}">
    <script>
        (function() {
            try {
                var saved = localStorage.getItem('theme');
                if (saved === 'dark' || (!saved && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                    document.documentElement.setAttribute('data-theme', 'dark');
                }
            } catch(e) {}
        })();
    </script>
    <script th:src="@{/js/customer-v2.js}" defer></script>
</head>
<body style="min-height: 100vh; display: flex; flex-direction: column; background: var(--color-bg);">

    <!-- Header Fragment -->
    <div th:replace="~{fragments/storefront/header :: header}"></div>

    <main class="container" style="flex: 1; padding-top: var(--space-8); padding-bottom: var(--space-16);">
        <!-- Breadcrumbs -->
        <nav aria-label="Breadcrumb" style="margin-bottom: var(--space-4);">
            <ol class="breadcrumb-list" style="display: flex; gap: 8px; list-style: none; padding: 0; margin: 0; font-size: var(--text-sm); color: var(--text-muted);">
                <li><a th:href="@{/}" style="color: var(--text-muted); text-decoration: none;">Home</a></li>
                <li>/</li>
                <li style="color: var(--text-strong); font-weight: var(--weight-medium);" aria-current="page">Best Of 2026</li>
            </ol>
        </nav>

        <div style="margin-bottom: var(--space-8);">
            <h1 style="font-family: var(--font-display); font-size: var(--text-3xl); font-weight: var(--weight-bold); margin: 0 0 var(--space-2); color: var(--text-strong);">
                The Best Vapes of 2026: Curated Buyer's Guides
            </h1>
            <p style="font-size: var(--text-base); color: var(--text-muted); margin: 0;">
                Editor-tested hardware recommendations backed by live price comparison across 25+ trusted retailers.
            </p>
        </div>

        <!-- Curated Sections Loop -->
        <div th:each="list : ${curatedLists}" style="margin-bottom: var(--space-12);">
            <div class="section-header">
                <div class="section-eyebrow">Curated Guide</div>
                <h2 class="section-title" th:text="${list['title']}">Best Pod Vapes</h2>
                <p style="font-size: var(--text-base); color: var(--text-muted); margin: 6px 0 0;" th:text="${list['description']}">
                    Our top picks for compact, flavor-packed pod systems.
                </p>
            </div>

            <!-- Products in this list -->
            <div class="product-grid" th:if="${list['products'] != null and not #lists.isEmpty(list['products'])}">
                <th:block th:each="prod : ${list['products']}">
                    <div th:replace="~{fragments/storefront/product-card :: card(prod=${prod})}"></div>
                </th:block>
            </div>
        </div>
    </main>

    <!-- Footer Fragment -->
    <div th:replace="~{fragments/storefront/footer :: footer}"></div>
</body>
</html>
