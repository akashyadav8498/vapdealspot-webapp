<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle != null ? pageTitle : 'Customer Sign In | Vape Deal Spot'}">Customer Sign In | Vape Deal Spot</title>
    <meta name="description" content="Sign in to your Vape Deal Spot customer account to track deals, save favorites, and manage your preferences.">
    <link rel="stylesheet" th:href="@{/css/customer-v2.css}">
    <script>
        (function() {
            try {
                var saved = localStorage.getItem('theme');
                if (saved === 'dark' || (!saved && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                    document.documentElement.setAttribute('data-theme', 'dark');
                }
            } catch(e) {}
        })();
    </script>
    <script th:src="@{/js/customer-v2.js}" defer></script>
</head>
<body style="min-height: 100vh; display: flex; flex-direction: column; background: var(--color-bg);">

    <!-- Header Fragment -->
    <div th:replace="~{fragments/storefront/header :: header}"></div>

    <main class="container" style="flex: 1; padding-top: var(--space-8); padding-bottom: var(--space-16); display: flex; flex-direction: column; align-items: center; justify-content: center;">

        <!-- Breadcrumbs -->
        <nav aria-label="Breadcrumb" style="width: 100%; max-width: 440px; margin-bottom: var(--space-4);">
            <ol style="display: flex; gap: 8px; list-style: none; padding: 0; margin: 0; font-size: var(--text-sm); color: var(--text-muted);">
                <li><a th:href="@{/}" style="color: var(--text-muted); text-decoration: none;">Home</a></li>
                <li>/</li>
                <li style="color: var(--text-strong); font-weight: var(--weight-medium);" aria-current="page">Sign In</li>
            </ol>
        </nav>

        <div class="card" style="width: 100%; max-width: 440px; padding: var(--space-8); background: var(--color-card); border: 1px solid var(--color-border); border-radius: var(--radius-lg); box-shadow: var(--shadow-sm);">
            <div style="text-align: center; margin-bottom: var(--space-6);">
                <div style="font-size: 32px; margin-bottom: var(--space-2);">💨</div>
                <h1 style="font-family: var(--font-display); font-size: var(--text-2xl); font-weight: var(--weight-bold); color: var(--text-strong); margin: 0 0 var(--space-2);">
                    Welcome Back
                </h1>
                <p style="font-size: var(--text-sm); color: var(--text-muted); margin: 0;">
                    Sign in to your Vape Deal Spot account
                </p>
            </div>

            <!-- Error Notification -->
            <div th:if="${error}" style="padding: var(--space-3) var(--space-4); background: rgba(239, 68, 68, 0.1); border: 1px solid #ef4444; border-radius: var(--radius-md); color: #ef4444; font-size: var(--text-sm); margin-bottom: var(--space-4); display: flex; align-items: center; gap: var(--space-2);" role="alert">
                <span>⚠️</span>
                <span th:text="${error}">Invalid credentials</span>
            </div>

            <!-- Logout Success Notification -->
            <div th:if="${param.logout}" style="padding: var(--space-3) var(--space-4); background: rgba(34, 197, 94, 0.1); border: 1px solid #22c55e; border-radius: var(--radius-md); color: #22c55e; font-size: var(--text-sm); margin-bottom: var(--space-4); display: flex; align-items: center; gap: var(--space-2);" role="status">
                <span>✓</span>
                <span>You have been signed out successfully.</span>
            </div>

            <form th:action="@{/login}" method="post" style="display: flex; flex-direction: column; gap: var(--space-4);">
                <input type="hidden" th:if="${_csrf}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                <input type="hidden" th:if="${continueUrl != null or param.continue != null}" name="continue" th:value="${continueUrl ?: param.continue}" />

                <div>
                    <label for="email" style="display: block; font-size: var(--text-sm); font-weight: var(--weight-medium); color: var(--text-strong); margin-bottom: var(--space-1);">Email Address</label>
                    <input type="email"
                           id="email"
                           name="email"
                           th:value="${email}"
                           required
                           autofocus
                           autocomplete="email"
                           placeholder="you@example.com"
                           style="width: 100%; padding: 10px 14px; font-size: var(--text-sm); border: 1px solid var(--color-border); border-radius: var(--radius-md); background: var(--color-bg); color: var(--text-strong); box-sizing: border-box;">
                </div>

                <div>
                    <label for="password" style="display: block; font-size: var(--text-sm); font-weight: var(--weight-medium); color: var(--text-strong); margin-bottom: var(--space-1);">Password</label>
                    <input type="password"
                           id="password"
                           name="password"
                           required
                           autocomplete="current-password"
                           placeholder="••••••••••••"
                           style="width: 100%; padding: 10px 14px; font-size: var(--text-sm); border: 1px solid var(--color-border); border-radius: var(--radius-md); background: var(--color-bg); color: var(--text-strong); box-sizing: border-box;">
                </div>

                <button type="submit" class="btn btn-primary btn-pill" style="width: 100%; margin-top: var(--space-2); padding: 12px; font-weight: var(--weight-bold); cursor: pointer;">
                    Sign In
                </button>
            </form>

            <div style="margin-top: var(--space-6); text-align: center; font-size: var(--text-sm); color: var(--text-muted); border-top: 1px solid var(--color-border); padding-top: var(--space-4);">
                <span>Don't have an account? </span>
                <a th:href="@{/register}" style="color: var(--primary); font-weight: var(--weight-semibold); text-decoration: none;">Create one now</a>
            </div>
        </div>
    </main>

    <!-- Footer Fragment -->
    <div th:replace="~{fragments/storefront/footer :: footer}"></div>
</body>
</html>
