<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle != null ? pageTitle : 'Category | Vape Deal Spot'}">Category | Vape Deal Spot</title>
    
    <meta name="description" th:content="${metaDescription != null ? metaDescription : 'Compare prices across 25+ trusted retailers.'}">
    
    <link rel="stylesheet" th:href="@{/css/customer-v2.css}">
    <script>
        (function() {
            try {
                var saved = localStorage.getItem('theme');
                if (saved === 'dark' || (!saved && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                    document.documentElement.setAttribute('data-theme', 'dark');
                }
            } catch(e) {}
        })();
    </script>
    <script th:src="@{/js/customer-v2.js}" defer></script>
</head>
<body style="min-height: 100vh; display: flex; flex-direction: column; background: var(--color-bg);">

    <!-- Header Fragment -->
    <div th:replace="~{fragments/storefront/header :: header}"></div>

    <main class="container listing-layout" style="flex: 1;">
        <!-- Breadcrumbs Fragment -->
        <div th:replace="~{fragments/storefront/breadcrumbs :: breadcrumbs(items=${breadcrumbs})}"></div>

        <!-- Category Header -->
        <div class="listing-header">
            <div style="display: flex; align-items: center; gap: 12px; margin-bottom: 8px;">
                <span style="font-size: 32px;" aria-hidden="true" th:text="${category.icon ?: '📦'}">📦</span>
                <h1 class="listing-title" style="margin: 0;" th:text="${category.name}">Pod Systems</h1>
            </div>
            <p class="listing-description" th:text="${metaDescription ?: 'Compare prices and discounts on all ' + category.name + '.'}">
                Compare prices and discounts on all pod vape kits.
            </p>
        </div>

        <div class="listing-body">
            <!-- Filter Sidebar -->
            <aside class="filter-sidebar">
                <form th:action="@{/category/{slug}(slug=${category.slug})}" method="get" id="filterForm">
                    <!-- In Stock Filter -->
                    <div class="filter-section">
                        <div class="filter-title">Availability</div>
                        <div class="filter-list">
                            <label class="filter-item">
                                <input type="checkbox" name="instock" value="true" th:checked="${inStockOnly}" onchange="document.getElementById('filterForm').submit()">
                                <span>In Stock Only</span>
                            </label>
                        </div>
                    </div>

                    <!-- Brand Filter -->
                    <div class="filter-section" th:if="${availableBrands != null and not #lists.isEmpty(availableBrands)}">
                        <div class="filter-title">Brands</div>
                        <div class="filter-list">
                            <label class="filter-item">
                                <input type="radio" name="brand" value="" th:checked="${selectedBrand == null or #strings.isEmpty(selectedBrand)}" onchange="document.getElementById('filterForm').submit()">
                                <span>All Brands</span>
                            </label>
                            <label class="filter-item" th:each="b : ${availableBrands}">
                                <input type="radio" name="brand" th:value="${b}" th:checked="${selectedBrand == b}" onchange="document.getElementById('filterForm').submit()">
                                <span th:text="${b}">SMOK</span>
                            </label>
                        </div>
                    </div>

                    <!-- Sort Preservation -->
                    <input type="hidden" name="sort" th:value="${sort}">

                    <div style="margin-top: var(--space-4);">
                        <a th:href="@{/category/{slug}(slug=${category.slug})}" class="btn btn-secondary btn-sm" style="width: 100%; text-align: center; display: block;">Reset Filters</a>
                    </div>
                </form>
            </aside>

            <!-- Results Column -->
            <div class="results-column">
                <div class="listing-toolbar">
                    <div class="listing-count">
                        Found <strong th:text="${totalResults}">8</strong> products
                    </div>

                    <!-- Sort Dropdown -->
                    <div style="display: flex; align-items: center; gap: 8px;">
                        <label for="sortSelect" style="font-size: var(--text-sm); color: var(--text-muted);">Sort by:</label>
                        <select id="sortSelect" class="form-input" style="padding: 6px 12px; font-size: var(--text-sm); border-radius: var(--radius-sm);"
                                onchange="location.href=this.value;">
                            <option th:value="@{/category/{slug}(slug=${category.slug}, brand=${selectedBrand}, instock=${inStockOnly}, sort='default')}"
                                    th:selected="${sort == 'default' or sort == null}">Relevance</option>
                            <option th:value="@{/category/{slug}(slug=${category.slug}, brand=${selectedBrand}, instock=${inStockOnly}, sort='price-asc')}"
                                    th:selected="${sort == 'price-asc'}">Price: Low to High</option>
                            <option th:value="@{/category/{slug}(slug=${category.slug}, brand=${selectedBrand}, instock=${inStockOnly}, sort='price-desc')}"
                                    th:selected="${sort == 'price-desc'}">Price: High to Low</option>
                        </select>
                    </div>
                </div>

                <!-- Empty State -->
                <div class="empty-state" th:if="${products == null or #lists.isEmpty(products)}">
                    <div class="empty-state-icon" aria-hidden="true">📦</div>
                    <h2 class="empty-state-title">No products found in this category</h2>
                    <p class="empty-state-message">
                        Try clearing active filters or explore other vape categories.
                    </p>
                    <a th:href="@{/categories}" class="btn btn-primary btn-pill">Browse All Categories</a>
                </div>

                <!-- Product Grid -->
                <div class="product-grid" th:if="${products != null and not #lists.isEmpty(products)}">
                    <th:block th:each="prod : ${products}">
                        <div th:replace="~{fragments/storefront/product-card :: card(prod=${prod})}"></div>
                    </th:block>
                </div>

                <!-- Pagination -->
                <nav th:if="${totalPages > 1}" aria-label="Category pagination" style="display: flex; justify-content: center; gap: 8px; margin-top: var(--space-10);">
                    <a th:if="${currentPage > 0}"
                       th:href="@{/category/{slug}(slug=${category.slug}, brand=${selectedBrand}, instock=${inStockOnly}, sort=${sort}, page=${currentPage - 1})}"
                       class="btn btn-secondary btn-sm">&larr; Previous</a>

                    <span style="display: flex; align-items: center; padding: 0 12px; font-size: var(--text-sm); color: var(--text-muted);"
                          th:text="'Page ' + (${currentPage} + 1) + ' of ' + ${totalPages}">Page 1 of 3</span>

                    <a th:if="${currentPage < totalPages - 1}"
                       th:href="@{/category/{slug}(slug=${category.slug}, brand=${selectedBrand}, instock=${inStockOnly}, sort=${sort}, page=${currentPage + 1})}"
                       class="btn btn-secondary btn-sm">Next &rarr;</a>
                </nav>
            </div>
        </div>
    </main>

    <!-- Footer Fragment -->
    <div th:replace="~{fragments/storefront/footer :: footer}"></div>
</body>
</html>
